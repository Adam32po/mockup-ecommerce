<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROS - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#2a75d3', dark: '#112240', light: '#f4f7fb', red: '#ef4444' } }
                }
            }
        }
    </script>
    
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        input[type="checkbox"] { accent-color: #2a75d3; width: 14px; height: 14px; }
        .hidden-form { display: none !important; }
    </style>
</head>
<body class="font-sans bg-gradient-to-br from-indigo-200 via-purple-200 to-blue-200 antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Global Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 text-white px-6 py-3 rounded-xl shadow-xl transform -translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 font-semibold text-sm">
        <i id="toast-icon" class="fa-solid fa-check-circle"></i>
        <span id="toast-message">Notifikasi</span>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-[900px] bg-brand-light shadow-2xl rounded-3xl overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Left Panel (Dark Blue Overlay) -->
        <div class="w-full md:w-5/12 relative p-10 md:p-12 flex flex-col justify-between min-h-[300px] md:min-h-[600px]">
            <img src="https://images.unsplash.com/photo-1556906781-9a412961c28c?auto=format&fit=crop&w=800&q=80" class="absolute inset-0 w-full h-full object-cover z-0 grayscale">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-900/95 to-brand-dark/95 z-0"></div>

            <div class="relative z-10 flex items-center gap-3">
                <div class="w-5 h-5 rounded-full bg-white flex items-center justify-center"><div class="w-2 h-2 rounded-full bg-blue-900"></div></div>
                <span class="font-bold tracking-widest text-white text-lg">AROS</span>
            </div>

            <div class="relative z-10 mt-16 md:mt-auto">
                <h1 id="welcome-title" class="text-4xl md:text-5xl font-bold text-white mb-4 leading-tight tracking-tight">Hello,<br>welcome!</h1>
                <p id="welcome-desc" class="text-xs md:text-sm text-blue-100/70 mb-8 leading-relaxed max-w-xs">Platform sepatu olahraga performa tinggi. Silakan masuk untuk mulai mengeksplorasi produk kami.</p>
                <button type="button" onclick="toggleAdminView()" id="toggle-btn" class="border border-white/60 text-white px-6 py-2.5 rounded-full text-xs font-semibold hover:bg-white hover:text-brand-dark transition-colors duration-300">
                    Masuk sebagai Admin
                </button>
            </div>
        </div>

        <!-- Right Panel (Forms) -->
        <div class="w-full md:w-7/12 p-8 md:p-14 flex flex-col justify-center bg-white relative overflow-hidden">
            
            <!-- FORM 1: CUSTOMER LOGIN -->
            <form id="customer-login-form" onsubmit="handleCustomerLogin(event)" class="space-y-4 fade-in">
                <h2 class="text-2xl font-bold text-brand-dark mb-6">Masuk Akun</h2>
                <div class="bg-white p-3 px-5 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Nickname / Username</label>
                    <input type="text" id="login-nick" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" placeholder="Masukkan nickname" required>
                </div>
                <div class="bg-white p-3 px-5 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Password</label>
                    <input type="password" id="login-pass" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" placeholder="••••••••" required>
                </div>
                <div class="flex justify-between items-center px-2 py-2">
                    <label class="flex items-center gap-2 text-xs text-gray-500 cursor-pointer font-medium"><input type="checkbox" checked> Remember me</label>
                    <a href="#" class="text-xs text-gray-400 hover:text-brand-blue font-medium">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-white text-brand-blue py-3.5 rounded-xl font-bold text-sm shadow-[0_4px_14px_0_rgba(0,0,0,0.05)] border border-gray-50 hover:shadow-[0_6px_20px_rgba(0,0,0,0.1)] transition-all mt-2">Masuk Belanja</button>
                <div class="text-center mt-8 border-t border-gray-100 pt-6">
                    <p class="text-[11px] text-gray-400 font-medium mb-3">Belum punya akun AROS?</p>
                    <button type="button" onclick="switchCustomerForm('register')" class="w-full bg-[#3b82f6] text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-colors">Daftar Akun Baru</button>
                </div>
            </form>

            <!-- FORM 2: CUSTOMER REGISTER -->
            <form id="customer-register-form" onsubmit="handleCustomerRegister(event)" class="space-y-3 fade-in hidden-form">
                <h2 class="text-2xl font-bold text-brand-dark mb-4">Daftar Akun</h2>
                <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Nama Lengkap</label>
                    <input type="text" id="reg-fullname" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                        <label class="block text-[10px] text-gray-400 font-semibold mb-1">Nickname (Unik)</label>
                        <input type="text" id="reg-nick" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" required>
                    </div>
                    <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                        <label class="block text-[10px] text-gray-400 font-semibold mb-1">Alamat Email</label>
                        <input type="email" id="reg-email" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" required>
                    </div>
                </div>
                <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-blue transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Buat Password</label>
                    <input type="password" id="reg-pass" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" placeholder="Min. 6 karakter" required minlength="6">
                </div>
                <button type="submit" class="w-full bg-[#3b82f6] text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-600 transition-colors mt-4">Selesaikan Pendaftaran</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="switchCustomerForm('login')" class="text-xs font-semibold text-gray-400 hover:text-brand-blue transition-colors">Sudah punya akun? Masuk di sini</button>
                </div>
            </form>

            <!-- FORM 3: ADMIN LOGIN -->
            <form id="admin-form" onsubmit="handleAdminLogin(event)" class="space-y-4 fade-in hidden-form">
                <h2 class="text-2xl font-bold text-brand-dark mb-6">System Access</h2>
                <div class="bg-white p-3 px-5 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-dark transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">ID Admin Akses</label>
                    <input type="text" id="admin-id" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent placeholder-gray-300" placeholder="Contoh: ADM-001" required>
                </div>
                <div class="bg-white p-3 px-5 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-dark transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Security Code / Password</label>
                    <input type="password" id="admin-pass" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent placeholder-gray-300" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-brand-dark text-white py-3.5 rounded-xl font-bold text-sm shadow-[0_4px_14px_0_rgba(0,0,0,0.1)] hover:bg-gray-800 transition-all mt-6 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock text-xs"></i> Buka Dashboard
                </button>
                <div class="text-center mt-6 border-t border-gray-100 pt-6">
                    <p class="text-[11px] text-gray-400 font-medium mb-3">Belum punya akses Admin?</p>
                    <button type="button" onclick="switchAdminForm('register')" class="w-full bg-gray-100 text-brand-dark py-3.5 rounded-xl font-bold text-sm shadow-sm hover:bg-gray-200 transition-colors">Daftar Admin Baru</button>
                </div>
            </form>

            <!-- FORM 4: ADMIN REGISTER (DENGAN HARDWARE ID) -->
            <form id="admin-register-form" onsubmit="handleAdminRegister(event)" class="space-y-3 fade-in hidden-form">
                <div class="flex items-center gap-2 mb-4">
                    <h2 class="text-2xl font-bold text-brand-dark">Daftar Admin</h2>
                    <span class="bg-brand-red text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-widest"><i class="fa-solid fa-shield-halved mr-1"></i> Secured</span>
                </div>
                
                <!-- Input Simulasi Kartu Fisik -->
                <div class="bg-blue-50 p-2.5 px-4 rounded-xl shadow-inner border border-blue-200 focus-within:border-brand-blue transition-colors relative overflow-hidden">
                    <div class="absolute right-3 top-1/2 transform -translate-y-1/2 text-blue-300 opacity-50"><i class="fa-solid fa-id-card text-2xl"></i></div>
                    <label class="block text-[10px] text-brand-blue font-bold mb-1 uppercase tracking-wider relative z-10">Scan ID Kartu Fisik *</label>
                    <input type="text" id="reg-admin-hardware" class="w-full outline-none text-sm font-bold text-brand-dark bg-transparent relative z-10" placeholder="Tap kartu atau ketik ID hardware" required>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-2">
                    <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-dark transition-colors">
                        <label class="block text-[10px] text-gray-400 font-semibold mb-1">ID Admin Baru</label>
                        <input type="text" id="reg-admin-id" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" placeholder="Contoh: ADM-002" required>
                    </div>
                    <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-dark transition-colors">
                        <label class="block text-[10px] text-gray-400 font-semibold mb-1">Nama Admin</label>
                        <input type="text" id="reg-admin-name" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" required>
                    </div>
                </div>
                <div class="bg-white p-2.5 px-4 rounded-xl shadow-sm border border-gray-100 focus-within:border-brand-dark transition-colors">
                    <label class="block text-[10px] text-gray-400 font-semibold mb-1">Buat Security Code / Password</label>
                    <input type="password" id="reg-admin-pass" class="w-full outline-none text-sm font-medium text-brand-dark bg-transparent" placeholder="Min. 6 karakter" required minlength="6">
                </div>
                <button type="submit" class="w-full bg-brand-dark text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-gray-900/30 hover:bg-gray-800 transition-colors mt-4">Simpan Akses Admin</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="switchAdminForm('login')" class="text-xs font-semibold text-gray-400 hover:text-brand-dark transition-colors">Kembali ke Halaman Login</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        let isCustomerView = true;

        // Inisialisasi Admin Default agar bisa langsung dicoba
        const initDefaultAdmin = () => {
            let admins = JSON.parse(localStorage.getItem('aros_admins'));
            if(!admins || admins.length === 0) {
                // Menambahkan hardwareId default juga
                const defaultAdmin = [{ id: 'admin', name: 'Super Admin', pass: 'admin123', hardwareId: 'MASTER-CARD-001' }];
                localStorage.setItem('aros_admins', JSON.stringify(defaultAdmin));
            }
        };
        initDefaultAdmin();

        // Custom Pop-up Toast
        const showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            
            if(type === 'error') {
                toast.className = "fixed top-5 right-5 bg-brand-red text-white px-6 py-3 rounded-xl shadow-lg transform -translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 font-semibold text-sm";
                icon.className = "fa-solid fa-circle-exclamation";
            } else {
                toast.className = "fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg transform -translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3 font-semibold text-sm";
                icon.className = "fa-solid fa-check-circle";
            }

            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-20', 'opacity-0'), 3000);
        };

        // Switch between Admin & Customer Panel
        function toggleAdminView() {
            const custLoginForm = document.getElementById('customer-login-form');
            const custRegForm = document.getElementById('customer-register-form');
            const adminLoginForm = document.getElementById('admin-form');
            const adminRegForm = document.getElementById('admin-register-form');
            
            const title = document.getElementById('welcome-title');
            const desc = document.getElementById('welcome-desc');
            const btn = document.getElementById('toggle-btn');

            if (isCustomerView) { // Beralih ke View Admin
                custLoginForm.classList.add('hidden-form');
                custRegForm.classList.add('hidden-form');
                adminRegForm.classList.add('hidden-form');
                adminLoginForm.classList.remove('hidden-form');
                
                title.innerHTML = 'Admin<br>Portal!';
                desc.innerText = 'Gunakan ID dan Password khusus untuk masuk ke sistem manajemen operasional AROS.';
                btn.innerText = 'Masuk sebagai Customer';
            } else { // Beralih ke View Customer
                adminLoginForm.classList.add('hidden-form');
                adminRegForm.classList.add('hidden-form');
                custRegForm.classList.add('hidden-form');
                custLoginForm.classList.remove('hidden-form');
                
                title.innerHTML = 'Hello,<br>welcome!';
                desc.innerText = 'Platform sepatu olahraga performa tinggi. Silakan masuk untuk mulai mengeksplorasi produk kami.';
                btn.innerText = 'Masuk sebagai Admin';
            }
            isCustomerView = !isCustomerView;
        }

        // Switch between Customer Login & Customer Register
        function switchCustomerForm(target) {
            const login = document.getElementById('customer-login-form');
            const register = document.getElementById('customer-register-form');
            
            if (target === 'register') {
                login.classList.add('hidden-form');
                register.classList.remove('hidden-form');
            } else {
                register.classList.add('hidden-form');
                login.classList.remove('hidden-form');
            }
        }

        // Switch between Admin Login & Admin Register
        function switchAdminForm(target) {
            const login = document.getElementById('admin-form');
            const register = document.getElementById('admin-register-form');
            
            if (target === 'register') {
                login.classList.add('hidden-form');
                register.classList.remove('hidden-form');
            } else {
                register.classList.add('hidden-form');
                login.classList.remove('hidden-form');
            }
        }

        // Handle Validasi & Registrasi Customer
        function handleCustomerRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-fullname').value.trim();
            const nick = document.getElementById('reg-nick').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            let customers = JSON.parse(localStorage.getItem('aros_customers')) || [];
            const isExist = customers.some(c => c.nickname === nick || c.email === email);
            
            if(isExist) {
                showToast('Gagal! Nickname atau Email sudah terdaftar.', 'error');
            } else {
                const newCustomer = {
                    fullName: fullName, nickname: nick, email: email, password: pass,
                    dateJoin: new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'}),
                    status: 'Aktif'
                };

                customers.push(newCustomer);
                localStorage.setItem('aros_customers', JSON.stringify(customers));
                
                showToast('Pendaftaran Berhasil! Silakan Login.', 'success');
                e.target.reset();
                setTimeout(() => { switchCustomerForm('login'); }, 1500);
            }
        }

        // Handle Customer Login
        function handleCustomerLogin(e) {
            e.preventDefault();
            const nick = document.getElementById('login-nick').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            
            let customers = JSON.parse(localStorage.getItem('aros_customers')) || [];
            const user = customers.find(c => c.nickname === nick && c.password === pass);

            if(user) {
                localStorage.setItem('aros_current_customer', user.nickname);
                localStorage.setItem('aros_active_user', user.nickname);
                localStorage.setItem('aros_active_email', user.email || '');
                localStorage.setItem('aros_active_phone', user.phone || '-');

                showToast('Login Berhasil! Mengalihkan...', 'success');
                setTimeout(() => { window.location.href = 'customer.html'; }, 800);
            } else {
                showToast('Nickname atau Password salah / belum terdaftar!', 'error');
            }
        }

        // Handle Registrasi Admin (DENGAN HARDWARE ID)
        function handleAdminRegister(e) {
            e.preventDefault();
            const hardwareId = document.getElementById('reg-admin-hardware').value.trim();
            const id = document.getElementById('reg-admin-id').value.trim();
            const name = document.getElementById('reg-admin-name').value.trim();
            const pass = document.getElementById('reg-admin-pass').value.trim();

            let admins = JSON.parse(localStorage.getItem('aros_admins')) || [];
            
            // Cek apakah ID Admin sudah dipakai
            const isExist = admins.some(a => a.id === id);
            // Cek apakah Kartu Fisik ini sudah dipakai admin lain
            const isHardwareExist = admins.some(a => a.hardwareId === hardwareId);
            
            if(isExist) {
                showToast('Gagal! ID Admin ini sudah digunakan.', 'error');
            } else if (isHardwareExist) {
                showToast('Gagal! Kartu Fisik ini sudah terikat ke akun lain.', 'error');
            } else {
                // Menyimpan hardware ID bersama data admin lainnya
                admins.push({ id: id, name: name, pass: pass, hardwareId: hardwareId });
                localStorage.setItem('aros_admins', JSON.stringify(admins));
                
                showToast('Akses Admin berhasil dibuat dari Kartu Fisik!', 'success');
                e.target.reset();
                setTimeout(() => { switchAdminForm('login'); }, 1500);
            }
        }

        // Handle Admin Login (DENGAN VALIDASI KETAT)
        function handleAdminLogin(e) {
            e.preventDefault();
            const adminId = document.getElementById('admin-id').value.trim();
            const adminPass = document.getElementById('admin-pass').value.trim();
            
            // Ambil data admin dari LocalStorage
            let admins = JSON.parse(localStorage.getItem('aros_admins')) || [];
            
            // Cari data admin yang ID dan Passwordnya cocok
            const validAdmin = admins.find(a => a.id === adminId && a.pass === adminPass);

            if(validAdmin) {
                localStorage.setItem('aros_current_admin', validAdmin.name);
                showToast('Akses Diterima! Membuka Dashboard...', 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Tampilkan pesan error jika ID atau Password tidak ada di sistem
                showToast('Akses Ditolak! ID atau Password Admin salah.', 'error');
            }
        }
    </script>
</body>
</html>
