<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROS - Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    
    <style>
        .input-minimal { width: 100%; border: none; border-bottom: 1px solid #bae6fd; border-radius: 0; padding: 10px 0; outline: none; background: transparent; transition: border-color 0.3s; color: #0c4a6e; }
        .input-minimal:focus { border-bottom-color: #0284c7; }
        .input-dark-minimal { width: 100%; border: none; border-bottom: 1px solid #0369a1; border-radius: 0; padding: 10px 0; outline: none; background: transparent; transition: border-color 0.3s; color: #ffffff; }
        .input-dark-minimal:focus { border-bottom-color: #ffffff; }
        .fade-in { animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="font-sans bg-brand-50 text-brand-900 antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Estetik -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1556906781-9a412961c28c?auto=format&fit=crop&w=2000&q=80" alt="AROS Background" class="w-full h-full object-cover opacity-20 grayscale">
        <div class="absolute inset-0 bg-gradient-to-tr from-brand-900/60 to-brand-500/20"></div>
    </div>

    <!-- Dual Login Card Portal -->
    <div class="w-full max-w-4xl bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl overflow-hidden flex flex-col md:flex-row fade-in relative z-10 border border-white/50">
        
        <!-- Customer Portal -->
        <div class="w-full md:w-1/2 p-10 md:p-14 border-b md:border-b-0 md:border-r border-brand-100 flex flex-col justify-center">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-brand-900">Customer Access</h2>
                <p class="text-xs uppercase tracking-widest text-brand-500 mt-1">Belanja & Eksplorasi Produk</p>
            </div>
            
            <form onsubmit="handleCustomerLogin(event)" class="space-y-5">
                <div>
                    <label class="text-[11px] uppercase tracking-widest text-brand-500 font-semibold">Nickname / Nama</label>
                    <input type="text" id="cust-name" class="input-minimal" placeholder="Contoh: AlexRider" required>
                </div>
                <div>
                    <label class="text-[11px] uppercase tracking-widest text-brand-500 font-semibold">Password Keamanan</label>
                    <input type="password" id="cust-pass" class="input-minimal" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-brand-600 text-white py-4 rounded-xl uppercase tracking-widest text-xs font-bold hover:bg-brand-700 transition shadow-lg shadow-brand-500/30 mt-4 flex items-center justify-center gap-2">
                    Masuk Belanja <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Admin Portal -->
        <div class="w-full md:w-1/2 p-10 md:p-14 bg-brand-900 text-white flex flex-col justify-center relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-brand-700 rounded-full blur-3xl opacity-50"></div>
            
            <div class="text-center mb-8 relative z-10">
                <div class="w-12 h-12 bg-brand-800 text-brand-100 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                    <i class="fa-solid fa-lock text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight">Admin Workspace</h2>
                <p class="text-xs uppercase tracking-widest text-brand-200 mt-1">Manajemen & Laporan Toko</p>
            </div>
            
            <form onsubmit="handleAdminLogin(event)" class="space-y-5 relative z-10">
                <div>
                    <label class="text-[11px] uppercase tracking-widest text-brand-200 font-semibold">ID Admin / Nickname</label>
                    <input type="text" id="admin-id" class="input-dark-minimal" placeholder="Contoh: ADM-001" required>
                </div>
                <div>
                    <label class="text-[11px] uppercase tracking-widest text-brand-200 font-semibold">Password Akses</label>
                    <input type="password" id="admin-pass" class="input-dark-minimal" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-white text-brand-900 py-4 rounded-xl uppercase tracking-widest text-xs font-bold hover:bg-brand-50 transition shadow-lg mt-4 flex items-center justify-center gap-2">
                    Buka Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

    </div>

    <script>
        function handleCustomerLogin(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value.trim();
            const pass = document.getElementById('cust-pass').value.trim();

            if(name !== '' && pass !== '') {
                localStorage.setItem('aros_current_customer', name);
                
                // Sinkronisasi history akun customer
                let customers = JSON.parse(localStorage.getItem('aros_customers')) || [];
                if(!customers.some(c => c.name === name)) {
                    customers.push({ 
                        name: name, 
                        date: new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'}), 
                        status: 'Aktif' 
                    });
                    localStorage.setItem('aros_customers', JSON.stringify(customers));
                }
                window.location.href = 'customer.html';
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const adminId = document.getElementById('admin-id').value.trim();
            const adminPass = document.getElementById('admin-pass').value.trim();

            if(adminId !== '' && adminPass !== '') {
                localStorage.setItem('aros_current_admin', adminId);
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
